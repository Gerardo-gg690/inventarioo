<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bon House · Inventario</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1c2033;--mut:#6b7186;--line:#e5e7f0;--acc:#e4572e;--acc2:#fde9e2;--ok:#1f9d7a;--okb:#e3f6ef;--warn:#c77a0a;--warnb:#fff1d9;--bad:#c9184a;--badb:#fde3ea;--nc:#8a90a6;--ncb:#eceef5;--lv1:#3b4cca;--lv2:#8b5cf6;--lv3:#0e8f8f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--card:#1b1e2d;--ink:#eceef8;--mut:#98a0bb;--line:#2b3046;--acc:#ff7a52;--acc2:#3a231d;--okb:#12332b;--warnb:#3a2c10;--badb:#3d1623;--ncb:#262a3d}}
:root[data-theme="dark"]{--bg:#12141f;--card:#1b1e2d;--ink:#eceef8;--mut:#98a0bb;--line:#2b3046;--acc:#ff7a52;--acc2:#3a231d;--okb:#12332b;--warnb:#3a2c10;--badb:#3d1623;--ncb:#262a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:var(--ink)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-weight:600}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.g{border-color:transparent;background:transparent;color:var(--mut)}
header{background:var(--ink);color:#fff;padding:14px 20px 0;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.logo{font-weight:800;font-size:20px;letter-spacing:-.03em}.logo i{font-style:normal;color:var(--acc)}
.tabs{display:flex;gap:2px;margin:10px auto 0;max-width:1200px}
.tabs button{background:transparent;border:0;color:#aab0c8;border-radius:10px 10px 0 0;padding:10px 18px}
.tabs button.on{background:var(--bg);color:var(--ink)}
.sp{flex:1}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border-radius:14px;padding:12px 16px;border:1px solid var(--line);text-align:left;cursor:pointer}
.kpi b{display:block;font-size:26px;letter-spacing:-.03em}.kpi span{color:var(--mut);font-size:13px}
.kpi.w b{color:var(--warn)}.kpi.b b{color:var(--bad)}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0 10px}
@media(max-width:760px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/3}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chips button{white-space:nowrap;border-radius:99px;padding:6px 13px;font-size:13.5px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{margin-top:18px}.cat>h2{font-size:17px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}.cat>h2 small{color:var(--mut);font-weight:400;font-size:13px}
.it{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.3fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--nc);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.it.ok{border-left-color:var(--ok)}.it.low{border-left-color:var(--warn)}.it.out{border-left-color:var(--bad)}.it.off{opacity:.55}
@media(max-width:820px){.it{grid-template-columns:1fr 1fr}.it .nm{grid-column:1/3}.it .ac{grid-column:1/3}}
.nm b{display:block;word-break:break-word;font-weight:700}.nm small{color:var(--mut)}
.lad{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lv{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff;background:var(--lv1)}.lv.l1{background:var(--lv2)}.lv.l2{background:var(--lv3)}
.simple{font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:99px;padding:1px 9px;margin-top:6px;display:inline-block}
.rv{font-size:11.5px;background:var(--warnb);color:var(--warn);border-radius:99px;padding:1px 8px;font-weight:700;margin-left:6px}
.st{font-size:17px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;margin-top:3px;background:var(--ncb);color:var(--nc)}
.ok .pill{background:var(--okb);color:var(--ok)}.low .pill{background:var(--warnb);color:var(--warn)}.out .pill{background:var(--badb);color:var(--bad)}
.mm{font-size:13px;color:var(--mut)}.mm b{color:var(--ink);font-weight:600}
.ac{display:flex;gap:6px;justify-content:flex-end}
.empty{color:var(--mut);padding:30px;text-align:center;border:1.5px dashed var(--line);border-radius:14px}
.prov{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.prov h3{margin:0;padding:11px 16px;background:var(--acc2);font-size:15px}
.prov div{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(15,18,30,.6)}
dialog form{padding:20px}dialog h2{margin:0 0 12px;font-size:18px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:13px;color:var(--mut);font-weight:600;display:flex;flex-direction:column;gap:4px}.f .w{grid-column:1/3}
.cnt{display:grid;gap:10px}.cnt label{display:flex;align-items:center;gap:10px;font-weight:700}.cnt input{max-width:130px}.cnt span{color:var(--mut);font-weight:400;font-size:13px}
.tot{margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:12px;font-weight:700}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.hint{font-size:12.5px;color:var(--mut);font-weight:400}
.o{background:transparent;border-color:#4a5070;color:#fff}.o:hover{background:#2b3046}
.f1{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600;margin-top:12px}
#fr{max-height:85vh;overflow:auto}.rl{display:grid;grid-template-columns:1fr 84px 104px 84px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.rl input,.rl select{padding:6px}
#msg{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1c2033;color:#fff;border:1px solid #4a5070;padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style>

  <div class="top"><div class="logo">Bon<i>·</i>House</div><span id="cl" style="color:#aab0c8;font-size:12.5px;margin-left:8px"></span><span class="sp"></span>
    <button class="o" id="pl">PDF stock bajo</button><button class="o" id="pa">PDF todos los productos</button>
    <button class="g" id="rst" style="color:#aab0c8">Restaurar datos del Excel</button>

</header>
<main>
  <div id="inv">
    <div class="kpis" id="kp"></div>
    <p class="mm" id="lu"></p>
    <div class="bar">
      <input id="q" placeholder="Buscar producto o proveedor" aria-label="Buscar">
      <select id="fp" aria-label="Proveedor"></select>
      <select id="ft" aria-label="Tipo"><option value="">Todas las presentaciones</option><option value="p">Con fardo / paquete / caja</option><option value="s">Productos simples</option></select>
      <select id="fe" aria-label="Estado"><option value="">Todos los estados</option><option value="low">Stock bajo</option><option value="out">Agotado</option><option value="ok">Disponible</option><option value="nc">Sin contar</option></select>
    </div>
    <div class="chips" id="gb"></div>
    <div class="chips" id="cc"></div>
    <div id="list"></div>
  </div>
  <div id="buy" hidden></div>
  <div id="his" hidden></div>
  <div id="mov" hidden></div>
  <div id="msg" role="status"></div>
</main>

   try{UP=Date.now();await DB.doc("inv/main").set({P,M,F,upd:UP,editor:bhUser.uid});SY=UP;window.bhCloudReady=true;cs("Inventario importado a Firebase")}catch(e){cs("Error al importar: "+e.message)}
  };
 }catch(e){authMsg.textContent="Error al configurar Firebase: "+e.message}
}

</script>
